<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
.container{
    width: 100%;
    height: 100vh;
    background: #7d2a9b;
    background: linear-gradient(90deg, rgba(125, 42, 155, 1) 0%, rgba(35, 14, 230, 1) 50%, rgba(59, 59, 56, 1) 100%);
    padding: 10px;
}
.todo-app{
    background-color: #ffff;
    width: 100%;
    max-width: 540px;
    border-radius: 10px;
    padding: 40px 30px 70px;
    margin: 120px auto 20px;
}
.row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 30px;
    padding-left: 20px;
    margin-bottom: 25px;
    margin-top: 25px;
    background: #edeef0;
}
input{
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px;
    font-size: 16px;
}
button{
    border: none;
    outline: none;
    cursor: pointer;
    padding: 16px 50px;
    background: #ff5945;
    color: #fff;
    font-size: 16px;
    border-radius: 40px;
}
ul li.checked{
    color: #555;
    text-decoration: line-through;
}
ul li.checked::before{
    content: ' ✔';
    background-image: url('image/checked.png');
}
ul li span{
    position: absolute;
    right: 0;
    top: 5px;
    width: 40px;
    height: 40px;
    font-size: 22px;
    color: #555;
    line-height: 40px;
    text-align: center;
    border-radius: 50%;
}
ul li span:hover{
    background: #edeefe;
}
ul li{
    list-style: none;
    font-size: 17px;
    padding: 12px 8px 12px 50px;
    user-select: none;
    cursor: pointer;
    position: relative;
}
ul li::before{
    content: '';
    position: absolute;
    left: 8px;
    top: 12px;
    width: 18px;
    height: 18px;
    border: 2px solid #ccc;
    border-radius: 50%;
}
    </style> 
    <title>Vazifalar royxati dasturi</title>
</head>

<body>
    <div class="container">
        <div class="todo-app">
            <h2>Vazifalar royxati</h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Vazifangizni yozing...">
                <button id="button_qoshish">Qo'shish</button>
            </div>
            <ul id="list-container">
                <li>Dars qilish<button>Ochirish</button></li>
            </ul>
        </div>
    </div>
    <script src="app.js">
        const inputBox = document.getElementById("input-box");
const listContainer = document.getElementById("list-container");
const button = document.getElementById("button_qoshish");

function AddTask() {
    if (inputBox.value === '') {
        alert("Iltimos vazifani kiriting");
        return;
    }

    let li = document.createElement("li");
    li.textContent = inputBox.value;
    listContainer.appendChild(li);

    let span = document.createElement("span");
    span.innerHTML = "\u00d7"; // × belgisi
    li.appendChild(span);

    inputBox.value = '';
    saveData();
}

button.addEventListener("click", AddTask);

listContainer.addEventListener("click", function (e) {
    if (e.target.tagName === "LI") {
        e.target.classList.toggle("checked");
        saveData();
    } else if (e.target.tagName === "SPAN") {
        e.target.parentElement.remove();
        saveData();
    }
}, false);

function saveData() {
    localStorage.setItem("data", listContainer.innerHTML);
}

function showTask() {
    listContainer.innerHTML = localStorage.getItem("data") || "";
}

showTask();
localStorage.clear()
    </script>
</body>

</html>
